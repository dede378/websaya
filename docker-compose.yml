services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: cyber_security
      DB_USER: root
      DB_PASS: saya123
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: saya123
      MYSQL_DATABASE: cyber_security
    volumes:
      - websaya_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -psaya123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  websaya_db:
